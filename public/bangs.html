    <script type="module">
      import * as fflate from "/s/fflate.min.js";

      const ICON_CACHE = new Map();
      const ZIP_CACHE = new Map();

      const getBucket = (url) => {
        const hostname = new URL(url).hostname.replace(/^www\./, "");
        const char = hostname.charAt(0);
        if ("abcdefghilmnoprstw".includes(char)) return char;
        const buckets = ["kv", "uj", "qxyz0123456789"];
        for (const bucket of buckets) if (bucket.includes(char)) return bucket;
        return "qxyz0123456789";
      };

      async function fetchIcon(bang) {
        const hostname = bang.urlObj.hostname.replace(/^www\./, "");
        if (ICON_CACHE.has(hostname)) return ICON_CACHE.get(hostname);

        const bucket = getBucket(bang.u);
        try {
          let zipEntries = ZIP_CACHE.get(bucket);
          if (!zipEntries) {
            const resp = await fetch(`https://files.helium.computer/favicons/${bucket}.zip`);
            if (!resp.ok) return null;
            const buffer = await resp.arrayBuffer();
            zipEntries = fflate.unzipSync(new Uint8Array(buffer));
            ZIP_CACHE.set(bucket, zipEntries);
          }
          const entryName = Object.keys(zipEntries).find((k) =>
            k.toLowerCase().startsWith(hostname.toLowerCase()),
          );
          if (entryName) {
            const blob = new Blob([zipEntries[entryName]], {
              type: "image/png",
            });
            const objUrl = URL.createObjectURL(blob);
            ICON_CACHE.set(hostname, objUrl);
            return objUrl;
          }
        } catch {}
        return null;
      }

      const calculateFuzzyScore = (query, target) => {
        let t = 0,
          g = 0,
          n = 0;
        for (const s of target) {
          if (t >= query.length) break;
          if (/^\s/.test(s)) continue;
          if (s === query[t]) {
            if (s === "." && g >= t) {
              t += 3;
              g += 3;
            } else {
              t++;
              g++;
            }
          } else {
            n = Math.max(g, n);
            g = 0;
          }
        }
        return t + n + 3 * g;
      };

      const getScore = (bang, query) => {
        let score = 0,
          maxT = 0;
        for (const t of bang.triggers) {
          if (t === query) maxT = Math.max(30, maxT);
          else maxT = Math.max(0.8 * calculateFuzzyScore(query, t), maxT);
        }
        score += maxT;
        const hostname = bang.urlObj.hostname.replace(/^www\./, "");
        score += 0.8 * calculateFuzzyScore(query, bang.name.toLowerCase());
        score += 0.8 * calculateFuzzyScore(query, hostname);
        return score;
      };

      let allBangs = [];
      const inputEl = document.getElementById("searchInput");
      const resultsEl = document.getElementById("results");
      const loaderEl = document.getElementById("loader");

      const normalize = (q) => {
        let clean = q.toLowerCase().trim();
        if (clean.startsWith("!") && clean.length > 1) clean = clean.slice(1);
        return clean.replace(/\s/g, "");
      };

      (async () => {
        try {
          const res = await fetch("https://files.helium.computer/bangs.json");
          let text = await res.text();
          text = text
            .replace(/^\/\/.*$/gm, "")
            .replace(/,(\s*])/g, "$1")
            .replace(/,(\s*})/g, "$1");
          const rawData = JSON.parse(text);
          inputEl.placeholder = `search ${rawData.length.toLocaleString("en-US")} bangs…`;

          const processed = {};
          for (const item of rawData) {
            let existing = processed[item.u];
            if (!existing) {
              processed[item.u] = item;
              existing = item;
            }

            const combined = new Set([
              existing.t,
              item.t,
              ...(existing.ts || []),
              ...(item.ts || []),
            ]);
            existing.ts = [...combined]
              .filter((x) => typeof x === "string")
              .sort((a, b) => a.length - b.length);
          }

          allBangs = Object.values(processed).map((s) => ({
            name: s.s,
            triggers: s.ts,
            u: s.u,
            urlObj: new URL(s.u),
          }));

          loaderEl.classList.add("hidden");
          inputEl.focus();
          performSearch("");
        } catch (e) {
          loaderEl.classList.add("failed");
          loaderEl.textContent = `couldn't load bangs: ${e.message}`;
        }
      })();

      const FEATURED = new Set([
        "co",
        "github",
        "ddg",
        "k",
        "w",
        "claude",
        "wa",
        "nebula",
        "mdn",
        "genius",
        "gi",
        "yt",
        "chatgpt",
        "x",
      ]);

      function performSearch(rawQuery) {
        const query = normalize(rawQuery);
        let results = [];

        if (query === "") {
          results = allBangs.filter((b) => b.triggers.some((t) => FEATURED.has(t))).slice(0, 14);
        } else {
          const scored = allBangs.map((bang) => ({
            bang,
            score: getScore(bang, query),
          }));
          scored.sort((a, b) => b.score - a.score || a.bang.name.length - b.bang.name.length);
          if (scored.length > 0) {
            const topScore = scored[0].score;
            results = scored
              .filter((i) => i.score > topScore / 4)
              .slice(0, 20)
              .map((i) => i.bang);
          }
        }
        renderResults(results, rawQuery);
      }

      const cards = new Map();
      const easing = "cubic-bezier(0.23, 1, 0.32, 1)";
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let rendered = false;

      const poweredBy = document.createElement("a");
      poweredBy.href = "https://helium.computer/bangs";
      poweredBy.target = "_blank";
      poweredBy.rel = "noopener";
      poweredBy.classList.add("poweredBy");
      poweredBy.innerHTML = `<svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12.1555 0.818897C12.1555 0.366633 12.5221 0 12.9744 0C13.4267 0 13.7933 0.366633 13.7933 0.818897V25.1811C13.7933 25.6334 13.4267 26 12.9744 26C12.5221 26 12.1555 25.6334 12.1555 25.1811V0.818897Z" fill="currentColor"></path><path d="M1.51522 2.68744C1.19542 2.36764 1.19542 1.84914 1.51522 1.52934C1.83502 1.20954 2.35352 1.20954 2.67332 1.52934L24.4962 23.3522C24.816 23.672 24.816 24.1905 24.4962 24.5103C24.1764 24.8301 23.6579 24.8301 23.3381 24.5103L1.51522 2.68744Z" fill="currentColor"></path><path d="M23.3381 1.5293C23.6579 1.2095 24.1764 1.2095 24.4962 1.5293C24.816 1.8491 24.816 2.3676 24.4962 2.68739L2.67334 24.5103C2.35354 24.8301 1.83505 24.8301 1.51525 24.5103C1.19545 24.1905 1.19545 23.672 1.51525 23.3522L23.3381 1.5293Z" fill="currentColor"></path><path d="M25.1811 12.2067C25.6334 12.2067 26 12.5733 26 13.0256C26 13.4779 25.6334 13.8445 25.1811 13.8445L0.818897 13.8445C0.366633 13.8445 -1.97691e-08 13.4779 0 13.0256C1.97691e-08 12.5733 0.366633 12.2067 0.818897 12.2067L25.1811 12.2067Z" fill="currentColor"></path></svg><span>bangs by helium</span>`;

      const makeCard = (bang) => {
        const card = document.createElement("div");
        card.className = "bang";

        const iconWrap = document.createElement("div");
        iconWrap.className = "bang-icon";

        const shimmer = document.createElement("div");
        shimmer.className = "shimmer";
        iconWrap.appendChild(shimmer);

        fetchIcon(bang).then((url) => {
          if (url) {
            const img = document.createElement("img");
            img.className = "icon";
            img.alt = "";
            img.src = url;
            iconWrap.replaceChildren(img);
            return;
          }
          const failedDiv = document.createElement("div");
          failedDiv.className = "failed";
          failedDiv.innerHTML = `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`;
          iconWrap.replaceChildren(failedDiv);
        });

        const info = document.createElement("div");
        info.className = "bang-info";

        const title = document.createElement("div");
        title.className = "bang-title";
        title.textContent = bang.name;
        title.title = bang.name;

        const triggers = document.createElement("div");
        triggers.className = "bang-triggers";

        const urlLink = document.createElement("a");
        urlLink.className = "bang-url";
        urlLink.textContent = bang.urlObj.hostname;
        urlLink.href = bang.urlObj.origin;
        urlLink.target = "_blank";
        urlLink.rel = "noopener noreferrer";

        info.append(title, triggers, urlLink);
        card.append(iconWrap, info);
        return { card, triggers };
      };

      function renderResults(bangs, rawQuery) {
        const before = new Map();
        for (const el of resultsEl.children) {
          if (el.classList.contains("bang")) before.set(el, el.getBoundingClientRect());
        }

        if (bangs.length === 0) {
          const empty = document.createElement("div");
          empty.className = "bangs-empty";
          const q = document.createElement("b");
          q.textContent = rawQuery.trim();
          empty.append("no bangs match ", q, ", try a site name or a trigger like !gh");
          resultsEl.replaceChildren(empty);
          return;
        }

        const t = normalize(rawQuery);
        const els = bangs.map((bang) => {
          let entry = cards.get(bang.u);
          if (!entry) {
            entry = makeCard(bang);
            cards.set(bang.u, entry);
          }
          const sortedTriggers = [...bang.triggers].sort((a, b) => {
            if (a === t) return -1;
            return a.length - b.length;
          });
          const displayStr = sortedTriggers
            .slice(0, 4)
            .map((x) => `!${x}`)
            .join(", ");
          entry.triggers.textContent = displayStr + (sortedTriggers.length > 4 ? "…" : "");
          entry.triggers.title = sortedTriggers.map((x) => `!${x}`).join(", ");
          return entry.card;
        });

        resultsEl.replaceChildren(...els, poweredBy);

        const first = !rendered;
        rendered = true;
        if (first || reduceMotion.matches) return;

        els.forEach((el) => {
          const prev = before.get(el);
          for (const a of el.getAnimations()) a.cancel();
          if (!prev) {
            el.animate(
              [
                { opacity: 0, translate: "0 6px" },
                { opacity: 1, translate: "0 0" },
              ],
              {
                duration: 200,
                easing,
                fill: "backwards",
              },
            );
            return;
          }
          const now = el.getBoundingClientRect();
          const dx = prev.left - now.left;
          const dy = prev.top - now.top;
          if (!dx && !dy) return;
          el.animate([{ translate: `${dx}px ${dy}px` }, { translate: "0 0" }], {
            duration: 240,
            easing,
          });
        });
      }

      inputEl.addEventListener("input", (e) => performSearch(e.target.value));
    </script>
  </body>
</html>
