    <script>
      try {
        const d = document.documentElement,
          L = localStorage;
        const a = L.getItem("ms-accent");
        if (a) d.style.setProperty("--blue", a);
        if (L.getItem("ms-theme") === "amoled") d.dataset.theme = "amoled";
        const m = L.getItem("ms-mascot");
        if (m && m !== "teto") {
          d.dataset.mascot = m;
          addEventListener("DOMContentLoaded", () => {
            const s = `/s/${m}.webp`,
              f = document.querySelector("link[rel~=icon]");
            if (f) f.href = s;
            document.querySelectorAll('img[src*="teto"]').forEach((i) => {
              i.src = s;
              i.style.objectFit = "contain";
            });
          });
        }
      } catch {}
    </script>
    <style>
      * {
        box-sizing: border-box;
        min-width: 0;
        text-underline-offset: 3px;
        -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
      }

      :root {
        color-scheme: dark;
        interpolate-size: allow-keywords;
        font-family:
          InstrumentSans,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,

          Ubuntu,

          "Open Sans",

        --text: #cdd6f4;
        --heading: #e5e9f8;
        --bg: #1f1e2e;
        --surface0: #313244;
        --surface1: #45475a;
        --subtext: #a6adc8;
        --blue: #89b4fa;
        --muted: #7f849c;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --ease-spring: cubic-bezier(0.22, 1.02, 0.3, 1);
      }

      :root[data-theme="amoled"] {
        --bg: #000;
        --surface0: #131318;
        --surface1: #222228;
      }

      :root[data-mascot="spongebob"] {
        --blue: #f4c842;
      }
      :root[data-mascot="gumi"] {
        --blue: #a6e3a1;
      }
      :root[data-mascot="miku"] {
        --blue: #4fd6c6;
      }
      :root[data-mascot="ralsei"] {
        --blue: #3ecf8e;
      }

      html {
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background-color: var(--bg);
        color: var(--text);
        scrollbar-gutter: stable;
        overflow-x: hidden;
      }

      input {
        field-sizing: content;
      }

      body {
        display: flex;
        width: 100%;
        margin: 0px;
        padding: 0px;
        min-height: 100dvh;
        flex-direction: column;
        overflow-x: hidden;
      }

      main {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        padding: 16vh 16px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .teto {
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
        user-select: none;
        transform-origin: 50% 85%;
        transition: scale 260ms var(--ease-spring);

        &.is-on {
          cursor: pointer;
          scale: 1.06;

          &:active {
            scale: 0.94;
            transition-duration: 160ms;
          }
        }
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--heading);
        text-wrap: balance;
      }

      .lost {
        margin: 8px 0 0;
        color: var(--subtext);
        font-size: 15px;
        line-height: 1.5;
        text-wrap: pretty;
        overflow-wrap: anywhere;

        code {
          font-family: inherit;
          color: var(--text);
          background: var(--surface0);
          padding: 1px 6px;
          border-radius: 5px;
        }
      }

      form {
        width: 100%;
        margin-top: 28px;
      }

      .search-container {
        display: flex;
      }

      .search-bar {
        height: 42px;
        background-color: var(--surface0);
        border: 1px solid #7f849c78;
        width: 100%;
        border-radius: 10px;
        display: flex;
        cursor: text;
        text-align: left;
        transition:
          border-color 150ms var(--ease-out),
          box-shadow 200ms var(--ease-out);

        &:has(input:focus) {
          border-color: #bac2de;
          outline: rgb(186, 194, 222) 0.5px solid;
        }

        input {
          background-color: transparent;
          border: none;
          height: 100%;
          width: 100%;
          padding: 0 12px;
          font-size: 1em;
          font-family: inherit;
          color: var(--text);
          caret-color: var(--blue);

          &:focus {
            outline: none;
          }

          &::placeholder {
            color: var(--muted);
          }
        }

        button {
          aspect-ratio: 1;
          height: 100%;
          border-radius: 8px;
          border: none;
          background-color: transparent;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--subtext);
          transform: scale(0.9);
          transition:
            color 100ms var(--ease-out),
            scale 200ms var(--ease-out);

          svg {
            width: 20px;
            height: 28px;
          }

          &:active {
            scale: 0.92;
          }

          &:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: -2px;
          }
        }
      }

      .home {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px 6px 8px;
        border-radius: 8px;
        color: var(--subtext);
        font-size: 15px;
        text-decoration: none;
        transition:
          color 100ms var(--ease-out),
          background-color 150ms var(--ease-out),
          scale 200ms var(--ease-out);

        svg {
          width: 16px;
          height: 16px;
          transition: translate 200ms var(--ease-out);
        }

        &:active {
          scale: 0.97;
        }

        &:focus-visible {
          outline: 2px solid var(--blue);
          outline-offset: 2px;
        }
      }

      @media (hover: hover) {
        .search-bar:not(:has(input:focus)):hover {
          border-color: #7f849cb0;
        }

        .search-bar button:hover {
          color: var(--text);
        }

        .home:hover {
          color: var(--text);
          background: var(--surface0);

          svg {
            translate: -2px 0;
          }
        }
      }

      @font-face {
        font-family: "InstrumentSans";
        font-display: swap;
        src: url("/s/inter-var-v4.woff2");
      }

      @view-transition {
        navigation: auto;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.1s;
      }

  <body>
    <main>
      <img src="/s/teto.webp" width="150" height="150" alt="teto" class="teto" draggable="false" />
      <h1>page not found :c</h1>
      <p class="lost">there's nothing at <code id="lost-path">this address</code></p>
      <form action="/">
        <div class="search-container">
          <div class="search-bar">
            <input name="q" placeholder="search for it instead…" aria-label="search" />
            <button title="search!" type="submit" aria-label="search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="m18.031 16.617 4.283 4.282-1.415 1.415-4.282-4.283A8.96 8.96 0 0 1 11 20c-4.968 0-9-4.032-9-9s4.032-9 9-9 9 4.032 9 9a8.96 8.96 0 0 1-1.969 5.617m-2.006-.742A6.98 6.98 0 0 0 18 11c0-3.867-3.133-7-7-7s-7 3.133-7 7 3.133 7 7 7a6.98 6.98 0 0 0 4.875-1.975z"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </form>
      <a href="/" class="home">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        go home
      </a>

    <script>
      (() => {
        let path = location.pathname;
        try {
          path = decodeURIComponent(path);
        } catch {}
        const code = document.getElementById("lost-path");
        if (code && path.length > 1) code.textContent = path.length > 60 ? `${path.slice(0, 57)}…` : path;
        const words = path
          .replace(/\.[a-z0-9]{1,5}$/i, "")
          .split(/[/_\-.+]+/)
          .filter(Boolean)
          .join(" ")
          .trim();
        const input = document.querySelector('.search-bar input[name="q"]');
        if (input && words && words.length <= 80) input.value = words;
      })();

      (() => {
        const teto = document.querySelector(".teto");
        if (!teto) return;

        const hitCanvas = document.createElement("canvas");
        const hitCtx = hitCanvas.getContext("2d", { willReadFrequently: true });
        const setupHit = () => {
          hitCanvas.width = teto.naturalWidth;
          hitCanvas.height = teto.naturalHeight;
          hitCtx.drawImage(teto, 0, 0);
        };
        if (teto.complete && teto.naturalWidth) setupHit();
        else teto.addEventListener("load", setupHit, { once: true });

        const isOnPlushie = (e) => {
          if (!hitCanvas.width) return false;
          const rect = teto.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width) * hitCanvas.width;
          const y = ((e.clientY - rect.top) / rect.height) * hitCanvas.height;
          if (x < 0 || y < 0 || x >= hitCanvas.width || y >= hitCanvas.height) return false;
          try {
            return hitCtx.getImageData(x | 0, y | 0, 1, 1).data[3] > 30;
          } catch {
            return true;
          }
        };

        teto.addEventListener("pointermove", (e) => {
          teto.classList.toggle("is-on", isOnPlushie(e));
        });
        teto.addEventListener("pointerleave", () => {
          teto.classList.remove("is-on");
        });

        const canvas = document.createElement("canvas");
        canvas.style.cssText =
          "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999";
        document.body.appendChild(canvas);

        const ctx = canvas.getContext("2d");
        const img = new Image();
        const mascot = document.documentElement.dataset.mascot;
        img.src = mascot ? `/s/${mascot}.webp` : "/s/teto.webp";

        const dpr = window.devicePixelRatio || 1;
        const resize = () => {
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener("resize", resize);

        const particles = [];
        let raf = 0;
        let last = 0;

        const tick = (now) => {
          const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
          last = now;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.vy += 1400 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rotation += p.spin * dt;
            p.life -= dt;

            if (p.life <= 0 || p.y > window.innerHeight + 200) {
              particles.splice(i, 1);
              continue;
            }

            const alpha = Math.min(1, p.life / 0.6);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.drawImage(img, -p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }

          if (particles.length) {
            raf = requestAnimationFrame(tick);
          } else {
            raf = 0;
            last = 0;
          }
        };

        const spawn = () => {
          const rect = teto.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const count = window.innerWidth < 600 ? 18 : 32;

          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 300 + Math.random() * 600;
            particles.push({
              x: cx + (Math.random() - 0.5) * 20,
              y: cy + (Math.random() - 0.5) * 20,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 400,
              rotation: Math.random() * Math.PI * 2,
              spin: (Math.random() - 0.5) * 12,
              size: 30 + Math.random() * 40,
              life: 1.8 + Math.random() * 0.8,
            });
          }

          if (!raf) raf = requestAnimationFrame(tick);
        };

        teto.addEventListener("click", (e) => {
          if (!isOnPlushie(e)) return;
          spawn();
        });
      })();
    </script>
    <script src="/s/omnibox.js" type="module"></script>
